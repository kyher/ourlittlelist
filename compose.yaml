# Local development stack. `docker compose up` installs dependencies, migrates the
# database and serves the app; see README.md.
#
# The DB_* defaults below match .env.example, so the stack also starts on a fresh
# clone before .env exists (the app container creates it on first run).

x-app-image: &app-image
    build:
        context: ./docker/app
        args:
            UID: '${UID:-1000}'
            GID: '${GID:-1000}'
    image: ourlittlelist/app:dev
    volumes:
        - '.:/var/www/html'

services:
    app:
        <<: *app-image
        environment:
            ROLE: app
            PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-4}'
        command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000', '--no-reload']
        ports:
            - '${APP_PORT:-80}:8000'
        depends_on:
            mysql:
                condition: service_healthy
            mailpit:
                condition: service_started

    vite:
        <<: *app-image
        environment:
            ROLE: vite
            VITE_PORT: '${VITE_PORT:-5173}'
        command: ['npm', 'run', 'dev']
        ports:
            - '${VITE_PORT:-5173}:5173'

    mysql:
        image: 'mysql:8.4'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_DATABASE: '${DB_DATABASE:-ourlittlelist}'
            MYSQL_USER: '${DB_USERNAME:-ourlittlelist}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD:-password}']
            interval: 3s
            timeout: 5s
            retries: 20
            start_period: 10s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
    mysql-data:
